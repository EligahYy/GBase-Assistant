# backend/config/glossary.yaml
# GBase 8a 业务词汇表 — NL2SQL 语义映射
# QueryGlossaryTool 在 Agent 查询业务术语时返回 (table, column) 映射
#
# 格式:
# terms:
#   <业务术语>:
#     table: <表名>
#     column: <列名>
#     synonyms: [<同义词1>, <同义词2>, ...]
#     sql_template: <可选: SQL 模板>

terms:
  # ── 客户维度 ──
  客户:
    table: customers
    column: customer_name
    synonyms: [客户名称, 客户名, 买家, 购买方]

  会员等级:
    table: customers
    column: member_level
    synonyms: [会员, 等级, VIP等级, 客户等级]

  注册时间:
    table: customers
    column: registered_at
    synonyms: [注册日期, 成为客户时间, 开户时间]

  累计消费:
    table: customers
    column: total_amount
    synonyms: [累计消费金额, 历史消费, 总消费额]

  # ── 产品维度 ──
  产品:
    table: products
    column: product_name
    synonyms: [商品, 货品, 物品, 产品名称, 商品名称]

  产品分类:
    table: products
    column: category
    synonyms: [品类, 产品类型, 商品分类, 分类]

  单价:
    table: products
    column: unit_price
    synonyms: [售价, 零售价, 价格, 销售单价]

  成本:
    table: products
    column: cost_price
    synonyms: [成本价, 进货价, 采购价]

  库存:
    table: products
    column: stock_quantity
    synonyms: [库存量, 库存数量, 存货, 现有库存]

  供应商:
    table: products
    column: supplier
    synonyms: [供货商, 厂家, 生产商]

  上架状态:
    table: products
    column: is_active
    synonyms: [是否上架, 在售, 售卖状态, 是否在售]

  # ── 订单维度 ──
  订单:
    table: orders
    column: order_id
    synonyms: [订单号, 订单编号, 交易]

  下单时间:
    table: orders
    column: order_date
    synonyms: [下单日期, 购买时间, 交易时间, 订单日期]

  订单状态:
    table: orders
    column: status
    synonyms: [状态, 订单进度, 处理状态]

  已取消:
    table: orders
    column: status
    synonyms: [取消订单, 已撤单]
    sql_template: "status = 'cancelled'"

  已完成:
    table: orders
    column: status
    synonyms: [完成订单, 已签收]
    sql_template: "status = 'delivered'"

  待付款:
    table: orders
    column: status
    synonyms: [未支付, 等待付款]
    sql_template: "status = 'pending'"

  # ── 金额维度 ──
  销售额:
    table: orders
    column: pay_amount
    synonyms: [销售金额, 营收, 收入, 实付金额, 交易额, 营业额]

  优惠金额:
    table: orders
    column: discount_amount
    synonyms: [折扣, 优惠, 减免金额, 满减]

  # ── 区域维度 ──
  区域:
    table: sales_regions
    column: region_name
    synonyms: [地区, 大区, 销售区域, 片区, 分区]

  区域负责人:
    table: sales_regions
    column: manager
    synonyms: [区域经理, 负责人, 大区经理]

  # ── 明细维度 ──
  购买数量:
    table: order_items
    column: quantity
    synonyms: [销量, 数量, 件数, 销售数量, 售出数量]

  小计:
    table: order_items
    column: subtotal
    synonyms: [小计金额, 明细金额, 行金额]

  # ── 复合概念 ──
  客单价:
    table: orders
    column: pay_amount
    synonyms: [平均订单金额, ARPU, 人均消费]
    sql_template: "AVG(pay_amount)"

  复购率:
    table: orders
    column: customer_id
    synonyms: [重复购买, 回头客]
    sql_template: "COUNT(DISTINCT customer_id)"

  热销产品:
    table: order_items
    column: quantity
    synonyms: [畅销, 爆款, 卖得好, 畅销品, 热卖]
    sql_template: "SUM(quantity) DESC"
