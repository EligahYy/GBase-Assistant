default_model: "deepseek/deepseek-chat"

models:
  sql_generation:
    primary: "deepseek/deepseek-chat"
    fallback:
      - "qwen/qwen2.5-72b-instruct"
      - "openai/gpt-4o"
    temperature: 0.1
    max_tokens: 2048

  knowledge_qa:
    primary: "deepseek/deepseek-chat"
    fallback:
      - "qwen/qwen2.5-72b-instruct"
      - "openai/gpt-4o"
    temperature: 0.3
    max_tokens: 4096

  intent_classification:
    primary: "deepseek/deepseek-chat"
    fallback:
      - "qwen/qwen2.5-72b-instruct"
      - "openai/gpt-4o-mini"
    temperature: 0.0
    max_tokens: 50

  general:
    primary: "deepseek/deepseek-chat"
    fallback:
      - "qwen/qwen2.5-72b-instruct"
      - "openai/gpt-4o"
    temperature: 0.3
    max_tokens: 2048

embedding:
  provider: "litellm"  # local | litellm
  dimension: 1024  # 显式声明，避免模型切换时维度不匹配
  local:
    model: "BAAI/bge-m3"
    device: "cpu"  # cpu | cuda | mps
  litellm:
    model: "openai/text-embedding-v4"
    api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"

collections:
  schemas: "schemas"
  sql_examples: "sql_examples"
  knowledge: "knowledge"
  error_codes: "error_codes"

providers:
  deepseek:
    api_base: "https://api.deepseek.com"
  qwen:
    api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"
